# Every hook runs the tool from the project's dev group, so versions come from
# uv.lock and match CI, which runs this same file.
repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false # checks src and tests, per [tool.mypy]
      - id: deptry
        name: deptry
        entry: uv run --frozen deptry src
        language: system
        files: ^(pyproject\.toml|uv\.lock|src/.*\.pyi?)$
        pass_filenames: false
