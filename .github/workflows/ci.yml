name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # The same hooks as a local commit: lock check, ruff, mypy, deptry.
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
