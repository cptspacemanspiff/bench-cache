[project]
name = "bench-cache"
version = "0.1.0"
description = "Benchmark effective prompt-cache rates of LLM providers across multi-turn conversations"
readme = "README.md"
authors = [
    { name = "Nicholas Long", email = "19273992+cptspacemanspiff@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pydantic-ai-slim[openai]>=2.49.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
bench-cache = "bench_cache.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
]
